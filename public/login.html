<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScreenDeck – Anmeldung</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <script src="/i18n.js"></script>
  <style>
    :root { --bg: #f4f5f7; --card: #fff; --text: #1c1f24; --muted: #6b7280; --border: #d1d5db; --accent: #2563eb; --danger: #dc2626; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1115; --card: #181b21; --text: #e6e8ec; --muted: #8b93a1; --border: #2a2f38; --accent: #5b8cff; --danger: #f87171; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    form { width: min(360px, 100%); background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px; display: grid; gap: 14px; text-align: center; }
    img { width: 56px; height: 56px; margin: 0 auto; }
    h1 { margin: 0; font-size: 20px; }
    p { margin: 0; color: var(--muted); font-size: 14px; }
    input { font: inherit; font-size: 24px; letter-spacing: .2em; text-align: center; padding: 10px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button { font: inherit; font-weight: 600; padding: 11px; border-radius: 9px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
    .error { color: var(--danger); font-weight: 600; min-height: 1.45em; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <img src="/logo.svg" alt="">
    <h1>ScreenDeck – {{TITLE}}</h1>
    <p>Bitte PIN eingeben</p>
    <input type="password" name="pin" inputmode="numeric" autocomplete="current-password" autofocus required aria-label="PIN">
    <input type="hidden" name="role" value="{{ROLE}}">
    <input type="hidden" name="next" value="{{NEXT}}">
    <div class="error">{{ERROR}}</div>
    <button>Anmelden</button>
  </form>
</body>
</html>
