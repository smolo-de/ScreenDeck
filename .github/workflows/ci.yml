# Tests und Sicherheitsprüfungen bei jedem Push und Pull Request, dazu wöchentlich (neue Lücken fallen so auch
# ohne Push auf); wird auch von release.yml vor dem Bauen aufgerufen – schlägt etwas fehl, gibt es kein Release.
# Actions sind auf Commit-Hashes festgelegt (Tags lassen sich nachträglich umhängen), Dependabot hält sie aktuell.
name: CI

on:
  push:
    branches: ['**'] # Tags baut release.yml
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1' # montags früh

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Syntax prüfen
        run: for f in server.js scripts/*.mjs scripts/dist/starter.cjs public/*.js; do node --check "$f"; done
      - name: Rauchtest
        run: npm test

  security:
    name: Sicherheit (Abhängigkeiten, Geheimnisse)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gesamter Verlauf für die Suche nach Geheimnissen
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Schwachstellen in Abhängigkeiten
        run: npm audit --audit-level=high
      - name: Gitleaks installieren
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$file" "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/$file"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks
      - name: Passwörter und Tokens im Git-Verlauf
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose'

  docker:
    name: Docker-Image
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: 0.76.1
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image bauen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: screendeck:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Container starten und prüfen
        run: |
          docker run -d --name screendeck -p 3990:3000 screendeck:test
          node scripts/smoke-test.mjs --url http://127.0.0.1:3990
          # Gesundheitscheck aus dem Dockerfile muss „healthy“ melden
          for i in $(seq 1 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' screendeck)
            [ "$status" = healthy ] && break
            sleep 2
          done
          echo "Gesundheitscheck: $status"
          [ "$status" = healthy ]
      - name: Trivy installieren
        run: |
          file="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$file" "https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/$file"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" trivy
      - name: Schwachstellen im Image
        # hoch/kritisch und nur, wenn es eine Korrektur gibt – sonst ließe sich der Fehler gar nicht beheben
        run: '"$RUNNER_TEMP/trivy" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 screendeck:test'
      - name: Protokoll des Containers
        if: always()
        run: docker logs screendeck || true
