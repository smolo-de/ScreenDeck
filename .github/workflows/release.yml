# Release: Tag „v1.2.3“ pushen → Tests, Pakete für Windows/Linux, Docker-Image, GitHub-Release.
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# Tags mit Bindestrich (v1.2.3-beta.1) werden als Vorabversion veröffentlicht, ohne Docker-Tag „latest“.
# Von Hand gestartet (workflow_dispatch) läuft alles als Probelauf: bauen und testen, nichts veröffentlichen.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  packages:
    name: Paket ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows und Linux x64 auf ihrem eigenen System; ARM64 wird auf x64 gebaut und per QEMU getestet
          # (ARM-Runner gibt es nicht für jedes Repo)
          - { target: win-x64, os: windows-latest, archive: zip, program: ScreenDeck.exe }
          - { target: linux-x64, os: ubuntu-latest, archive: tar.gz, program: screendeck }
          - { target: linux-arm64, os: ubuntu-latest, archive: tar.gz, program: screendeck, emulate: linux/arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Version aus dem Tag
        if: env.PUBLISH == 'true'
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm ci --no-audit --no-fund
      - name: Paket bauen
        run: npm run dist -- ${{ matrix.target }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.emulate
      - name: Archiv auspacken und Programm testen
        run: |
          check="$RUNNER_TEMP/check"
          mkdir -p "$check"
          if [ "${{ matrix.archive }}" = zip ]; then
            /c/Windows/System32/tar.exe -xf dist/ScreenDeck-${{ matrix.target }}.zip -C "$check"
          else
            tar -xzf dist/ScreenDeck-${{ matrix.target }}.tar.gz -C "$check"
          fi
          program="ScreenDeck-${{ matrix.target }}/${{ matrix.program }}"
          if [ -n "${{ matrix.emulate }}" ]; then
            # fremde Architektur: Rauchtest in einem emulierten Container (glibc wie auf Debian/Raspberry Pi OS)
            docker run --rm --platform ${{ matrix.emulate }} -e SMOKE_TIMEOUT=120               -v "$check:/check" -v "$PWD/scripts:/scripts:ro" node:24-slim               node /scripts/smoke-test.mjs "/check/$program"
          else
            node scripts/smoke-test.mjs "$check/$program"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ScreenDeck-${{ matrix.target }}
          path: dist/ScreenDeck-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker-Image (amd64 + arm64)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/screendeck
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha
          flavor: latest=auto
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image bauen und veröffentlichen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub-Release
    needs: [packages, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ScreenDeck-* # nicht die .dockerbuild-Einträge von build-push-action
          path: dist
          merge-multiple: true
      - name: Prüfsummen
        working-directory: dist
        run: sha256sum ScreenDeck-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/screendeck
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ## Downloads

          | System | Datei |
          |---|---|
          | Windows 10/11 (64 Bit) | \`ScreenDeck-win-x64.zip\` – auspacken, \`ScreenDeck.exe\` starten |
          | Linux x64 | \`ScreenDeck-linux-x64.tar.gz\` |
          | Linux ARM64 (z. B. Raspberry Pi 4/5) | \`ScreenDeck-linux-arm64.tar.gz\` |
          | Docker | \`docker pull ${IMAGE,,}:${version}\` |

          Keine weitere Installation nötig – Node.js ist im Programm enthalten. Prüfsummen: \`SHA256SUMS.txt\`.
          EOF
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "ScreenDeck $version" \
            --notes-file notes.md --generate-notes "${flags[@]}"
