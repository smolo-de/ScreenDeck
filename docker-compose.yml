# ScreenDeck mit Docker Compose: docker compose up -d
# Danach: Verwaltung unter http://<IP-des-Rechners>/admin, Screens unter http://<IP-des-Rechners>/
services:
  screendeck:
    build: .
    image: screendeck
    container_name: screendeck
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "80:3000" # Adressen ohne Portangabe – Port 80 auf dem Rechner muss frei sein (sonst Zeile entfernen)
    environment:
      # Im Container sieht ScreenDeck nur seine interne Adresse. Für richtige Adressen und QR-Codes
      # hier die IP (oder den Namen) des Docker-Rechners eintragen, z. B. 192.168.2.71:
      PUBLIC_HOST: ""
      PUBLIC_PORT: "80" # passend zur Portweiterleitung oben (ohne Port 80: "3000")
      TZ: Europe/Berlin
    volumes:
      - screendeck-data:/data
      # Medienordner des Rechners einbinden (in der Verwaltung dann als /media/fotos hinzufügen):
      # - /pfad/zu/fotos:/media/fotos:ro

    # Alternative unter Linux: Host-Netzwerk – dann stimmen Adressen von selbst und screendeck.local
    # funktioniert. Dafür „ports“ und PUBLIC_* oben entfernen und diese Zeile aktivieren:
    # network_mode: host

volumes:
  screendeck-data:
